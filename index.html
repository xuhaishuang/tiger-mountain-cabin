<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐯 小老虎的山间小屋</title>
<style>
  :root { --orange:#f89830; --brown:#8b5a3c; --green:#7a9a50; --sky:#e8f0f8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    overflow:hidden; background:var(--sky);
    font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  canvas { display:block; }

  /* 加载 */
  #loading {
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(180deg, #e8f0f8 0%, #c8e0d8 40%, #8ab860 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity 0.6s, visibility 0.6s;
  }
  #loading.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  #loading .tiger-icon { font-size:72px; animation:tigerBounce 0.7s ease-in-out infinite; }
  @keyframes tigerBounce {
    0%,100% { transform:translateY(0) rotate(0deg); }
    30% { transform:translateY(-16px) rotate(-5deg); }
    60% { transform:translateY(-4px) rotate(3deg); }
  }
  #loading .title { font-size:26px; font-weight:bold; color:#5a3a20; margin-top:12px; letter-spacing:3px; }
  #loading .subtitle { color:#7a5a40; font-size:14px; margin-top:6px; }

  /* 标题栏 */
  #top-bar {
    position:fixed; top:12px; left:50%; z-index:20; transform:translateX(-50%);
    background:rgba(255,255,255,0.8); backdrop-filter:blur(10px);
    border-radius:20px; padding:8px 20px; pointer-events:none;
  }
  #top-bar span { font-size:17px; font-weight:bold; color:#5a3a20; letter-spacing:2px; }

  /* 状态标签 */
  #status-tag {
    position:fixed; top:70px; right:14px; z-index:20;
    background:rgba(255,255,255,0.8); backdrop-filter:blur(10px);
    border-radius:14px; padding:8px 14px;
    font-size:13px; color:#8b5a3c; font-weight:bold;
    transition:all 0.3s;
  }
  #status-tag.in-house { background:rgba(255,240,220,0.9); color:#c46030; }
  #status-tag.swimming { background:rgba(200,230,255,0.9); color:#3078c0; }
  #status-tag.hiding { background:rgba(220,210,200,0.9); color:#6a5a4a; }

  /* 底部提示 */
  #hint-bar {
    position:fixed; bottom:28px; left:50%; z-index:20; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
    border-radius:16px; padding:10px 18px;
    color:#fff; font-size:13px; letter-spacing:1px;
    pointer-events:none; transition:all 0.5s; text-align:center;
  }

  /* 进屋按钮 */
  #enter-btn {
    position:fixed; bottom:100px; left:50%; z-index:25; transform:translateX(-50%);
    background:rgba(255,150,50,0.9); color:#fff;
    border:none; border-radius:20px; padding:10px 22px;
    font-size:15px; font-weight:bold; letter-spacing:2px;
    cursor:pointer; display:none;
    box-shadow:0 4px 16px rgba(255,150,50,0.4);
    transition:all 0.2s;
  }
  #enter-btn:hover { transform:translateX(-50%) scale(1.05); }
  #enter-btn:active { transform:translateX(-50%) scale(0.95); }
  #enter-btn.show { display:block; }

  /* 水花粒子 */
  .splash-particle {
    position:fixed; z-index:15; pointer-events:none;
    width:6px; height:6px; border-radius:50%;
    background:#80d0f8;
    animation:splashUp 0.7s ease-out forwards;
  }
  @keyframes splashUp {
    0% { transform:translate(0,0) scale(1); opacity:0.9; }
    100% { transform:translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  /* 响应式 */
  @media (max-width:640px) {
    #top-bar span { font-size:14px; letter-spacing:1px; }
    #hint-bar { font-size:11px; bottom:20px; padding:8px 14px; }
    #status-tag { top:60px; right:8px; font-size:11px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="tiger-icon">🐯</div>
  <div class="title">小老虎的山间小屋</div>
  <div class="subtitle">点一下地面，小老虎就摇着尾巴走过去啦～</div>
</div>

<div id="top-bar"><span>🐯 小老虎的山间小屋 🏠</span></div>
<div id="status-tag">🐾 在山坡上散步</div>
<div id="hint-bar">👆 点击地面让小老虎走过去吧！</div>
<button id="enter-btn">🏠 进屋看看</button>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';

// ============ DOM ============
const loading = document.getElementById('loading');
const statusTag = document.getElementById('status-tag');
const hintBar = document.getElementById('hint-bar');
const enterBtn = document.getElementById('enter-btn');

// ============ 场景 ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#d8e8f8');
scene.fog = new THREE.Fog('#d8e8f8', 10, 30);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 40);
camera.position.set(6, 5.5, 9);
camera.lookAt(0, 2.5, 0);

// ============ 灯光 ============
scene.add(new THREE.AmbientLight('#fff8f0', 1.2));
const sun = new THREE.DirectionalLight('#fffef8', 5);
sun.position.set(8, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 35;
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.0003;
scene.add(sun);
scene.add(new THREE.DirectionalLight('#ffe0d0', 1.5).position.set(-3, 5, -2));

// ============ 材质库 ============
const matGround = new THREE.MeshStandardMaterial({ color:'#8ab860', roughness:0.7 });
const matMountain = new THREE.MeshStandardMaterial({ color:'#7a9a50', roughness:0.65 });
const matMountainRock = new THREE.MeshStandardMaterial({ color:'#6b8a40', roughness:0.55 });
const matWood = new THREE.MeshStandardMaterial({ color:'#c8956a', roughness:0.5 });
const matWoodDark = new THREE.MeshStandardMaterial({ color:'#a07550', roughness:0.55 });
const matRoof = new THREE.MeshStandardMaterial({ color:'#c45040', roughness:0.45 });
const matDoor = new THREE.MeshStandardMaterial({ color:'#6b4030', roughness:0.4 });
const matWindow = new THREE.MeshStandardMaterial({ color:'#f8f0d8', roughness:0.2, emissive:'#ffe8c0', emissiveIntensity:0.3 });
const matWater = new THREE.MeshStandardMaterial({ color:'#5ba8d0', roughness:0.1, metalness:0.15 });
const matStone = new THREE.MeshStandardMaterial({ color:'#9a9a90', roughness:0.55 });
const matTreeTrunk = new THREE.MeshStandardMaterial({ color:'#8b6b4a', roughness:0.6 });
const matTreeLeaves = new THREE.MeshStandardMaterial({ color:'#5a9040', roughness:0.6 });
const matBush = new THREE.MeshStandardMaterial({ color:'#6a9a48', roughness:0.6 });

// 老虎材质
const matTigerOrange = new THREE.MeshStandardMaterial({ color:'#f89830', roughness:0.5 });
const matTigerWhite = new THREE.MeshStandardMaterial({ color:'#fef0e0', roughness:0.45 });
const matTigerStripe = new THREE.MeshStandardMaterial({ color:'#2a1510', roughness:0.5 });
const matTigerNose = new THREE.MeshStandardMaterial({ color:'#e87080', roughness:0.3 });
const matTigerEye = new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:0.05 });
const matTigerPupil = new THREE.MeshStandardMaterial({ color:'#0a0505', roughness:0.05, metalness:0.5 });
const matTigerEar = new THREE.MeshStandardMaterial({ color:'#f8b8a0', roughness:0.4 });

// 室内物品
const matSwingRope = new THREE.MeshStandardMaterial({ color:'#c8a888', roughness:0.6 });
const matSwingBoard = new THREE.MeshStandardMaterial({ color:'#d4a878', roughness:0.5 });
const matBall = new THREE.MeshStandardMaterial({ color:'#e84040', roughness:0.3, metalness:0.1 });
const matScratchPost = new THREE.MeshStandardMaterial({ color:'#c8b090', roughness:0.7 });
const matRug = new THREE.MeshStandardMaterial({ color:'#f0c890', roughness:0.7 });

// ============ 地形高度函数 ============
function getTerrainHeight(x, z) {
  const dist = Math.sqrt(x * x + z * z);
  const topRadius = 2.5;
  const baseRadius = 6.5;
  const topHeight = 3.5;
  if (dist < topRadius) return topHeight;
  if (dist > baseRadius) return 0;
  const t = (dist - topRadius) / (baseRadius - topRadius);
  return topHeight * (1 - t);
}

// ============ 场景构建 ============

// -- 地面 --
const groundGeo = new THREE.CircleGeometry(12, 48);
const ground = new THREE.Mesh(groundGeo, matGround);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
ground.name = 'ground';
scene.add(ground);

// -- 山体（平顶锥台）--
const mountainGeo = new THREE.CylinderGeometry(2.5, 6.5, 3.5, 40);
const mountain = new THREE.Mesh(mountainGeo, matMountain);
mountain.position.y = 1.75;
mountain.receiveShadow = true;
mountain.castShadow = true;
mountain.name = 'mountain';
scene.add(mountain);

// 山腰岩石层
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.3;
  const dist = 3.2 + Math.random() * 1.8;
  const h = getTerrainHeight(Math.cos(angle) * dist, Math.sin(angle) * dist);
  const rockGeo = new THREE.SphereGeometry(0.3 + Math.random() * 0.5, 8, 6);
  const rock = new THREE.Mesh(rockGeo, matMountainRock);
  rock.position.set(Math.cos(angle) * dist, h - 0.1, Math.sin(angle) * dist);
  rock.scale.y = 0.5 + Math.random() * 0.4;
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

// -- 山下小丘陵 --
for (let i = 0; i < 6; i++) {
  const angle = (i / 6) * Math.PI * 2;
  const dist = 6 + Math.random() * 3;
  const hillGeo = new THREE.SphereGeometry(0.6 + Math.random() * 1.2, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2.5);
  const hill = new THREE.Mesh(hillGeo, i % 2 === 0 ? matGround : matMountain);
  hill.position.set(Math.cos(angle) * dist, -0.1, Math.sin(angle) * dist);
  hill.receiveShadow = true;
  scene.add(hill);
}

// ============ 池塘 ============
const pondGeo = new THREE.CircleGeometry(1.6, 36);
const pond = new THREE.Mesh(pondGeo, matWater);
pond.rotation.x = -Math.PI / 2;
pond.position.set(3.8, 0.02, -4.5);
pond.receiveShadow = true;
pond.name = 'pond';
scene.add(pond);

// 池塘石头
for (let i = 0; i < 14; i++) {
  const angle = (i / 14) * Math.PI * 2;
  const stoneGeo = new THREE.SphereGeometry(0.1 + Math.random() * 0.25, 8, 6);
  const stone = new THREE.Mesh(stoneGeo, matStone);
  stone.position.set(
    3.8 + Math.cos(angle) * 1.65,
    0.02,
    -4.5 + Math.sin(angle) * 1.65
  );
  stone.scale.y = 0.4;
  stone.castShadow = true;
  scene.add(stone);
}

// ============ 房子 ============
const houseGroup = new THREE.Group();
houseGroup.position.set(0, 3.5, 0);
houseGroup.name = 'house';

// 地板
const floorGeo = new THREE.BoxGeometry(2.2, 0.12, 2.2);
const houseFloor = new THREE.Mesh(floorGeo, matWood);
houseFloor.position.y = 0.06;
houseFloor.receiveShadow = true;
houseGroup.add(houseFloor);

// 墙壁
const wallMat = new THREE.MeshStandardMaterial({ color:'#d8c0a8', roughness:0.5 });
const wallGeo = new THREE.BoxGeometry(0.12, 1.6, 2.0);
// 后墙
const backWall = new THREE.Mesh(wallGeo, wallMat);
backWall.position.set(0, 0.86, -0.94);
backWall.receiveShadow = true; backWall.castShadow = true;
backWall.name = 'backWall';
houseGroup.add(backWall);
// 左墙
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.6, 1.3), wallMat);
leftWall.position.set(-1.04, 0.86, 0.35);
leftWall.receiveShadow = true; leftWall.castShadow = true;
leftWall.name = 'leftWall';
houseGroup.add(leftWall);
// 右墙
const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.6, 2.0), wallMat);
rightWall.position.set(1.04, 0.86, 0);
rightWall.receiveShadow = true; rightWall.castShadow = true;
rightWall.name = 'rightWall';
houseGroup.add(rightWall);
// 前墙（有门洞）- 分左右两半
const frontWallGeo = new THREE.BoxGeometry(0.12, 1.6, 0.5);
const frontLeft = new THREE.Mesh(frontWallGeo, wallMat);
frontLeft.position.set(-0.6, 0.86, 0.94);
frontLeft.receiveShadow = true; frontLeft.castShadow = true;
frontLeft.name = 'frontWall';
houseGroup.add(frontLeft);
const frontRight = new THREE.Mesh(frontWallGeo, wallMat);
frontRight.position.set(0.6, 0.86, 0.94);
frontRight.receiveShadow = true; frontRight.castShadow = true;
frontRight.name = 'frontWall';
houseGroup.add(frontRight);
// 门上方墙体
const frontTopGeo = new THREE.BoxGeometry(0.12, 0.5, 0.6);
const frontTop = new THREE.Mesh(frontTopGeo, wallMat);
frontTop.position.set(0, 1.35, 0.94);
frontTop.name = 'frontWall';
houseGroup.add(frontTop);

// 屋顶
const roofGroup = new THREE.Group();
roofGroup.name = 'roof';
const roofGeo = new THREE.ConeGeometry(1.8, 0.7, 4);
const roof = new THREE.Mesh(roofGeo, matRoof);
roof.position.y = 2.05;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
roof.name = 'roofMesh';
roofGroup.add(roof);
// 屋顶尖
const roofTipGeo = new THREE.SphereGeometry(0.12, 8, 8);
const roofTip = new THREE.Mesh(roofTipGeo, matRoof);
roofTip.position.y = 2.4;
roofGroup.add(roofTip);
houseGroup.add(roofGroup);

// 烟囱
const chimneyGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
const chimney = new THREE.Mesh(chimneyGeo, matWoodDark);
chimney.position.set(0.6, 2.2, -0.5);
chimney.castShadow = true;
houseGroup.add(chimney);

// 窗户（发光）
for (let wx = -0.5; wx <= 0.5; wx += 1) {
  const winGeo = new THREE.PlaneGeometry(0.4, 0.4);
  const win = new THREE.Mesh(winGeo, matWindow);
  win.position.set(wx, 1.1, -0.93);
  win.name = 'window';
  houseGroup.add(win);
}

// -- 室内物品 --
const interiorGroup = new THREE.Group();
interiorGroup.name = 'interior';

// 秋千
const swingGroup = new THREE.Group();
swingGroup.name = 'swing';
swingGroup.position.set(-0.5, 0.7, -0.3);
const ropeGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8);
for (let rx = -0.2; rx <= 0.2; rx += 0.4) {
  const rope = new THREE.Mesh(ropeGeo, matSwingRope);
  rope.position.set(rx, 0.5, 0);
  swingGroup.add(rope);
}
const boardGeo = new THREE.BoxGeometry(0.5, 0.06, 0.18);
const board = new THREE.Mesh(boardGeo, matSwingBoard);
board.position.y = 0.08;
board.name = 'swingBoard';
swingGroup.add(board);
interiorGroup.add(swingGroup);

// 皮球
const ballGeo = new THREE.SphereGeometry(0.15, 16, 16);
const ball = new THREE.Mesh(ballGeo, matBall);
ball.position.set(0.4, 0.15, 0.3);
ball.name = 'ball';
ball.castShadow = true;
interiorGroup.add(ball);

// 猫抓柱
const scratchPostGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.7, 12);
const scratchPost = new THREE.Mesh(scratchPostGeo, matScratchPost);
scratchPost.position.set(-0.4, 0.35, 0.5);
scratchPost.name = 'scratchPost';
scratchPost.castShadow = true;
interiorGroup.add(scratchPost);
// 抓柱底座
const scratchBaseGeo = new THREE.CylinderGeometry(0.2, 0.22, 0.08, 16);
const scratchBase = new THREE.Mesh(scratchBaseGeo, matWoodDark);
scratchBase.position.set(-0.4, 0.04, 0.5);
interiorGroup.add(scratchBase);
// 麻绳缠绕
for (let s = 0; s < 4; s++) {
  const ropeRingGeo = new THREE.TorusGeometry(0.11, 0.015, 6, 16);
  const ropeRing = new THREE.Mesh(ropeRingGeo, matSwingRope);
  ropeRing.position.set(-0.4, 0.2 + s * 0.15, 0.5);
  interiorGroup.add(ropeRing);
}

// 小地毯
const rugGeo = new THREE.PlaneGeometry(0.8, 1.0);
const rug = new THREE.Mesh(rugGeo, matRug);
rug.rotation.x = -Math.PI / 2;
rug.position.y = 0.07;
interiorGroup.add(rug);

houseGroup.add(interiorGroup);
scene.add(houseGroup);

// 房子存储引用
const houseWalls = [backWall, leftWall, rightWall, frontLeft, frontRight, frontTop];
const houseData = {
  walls: houseWalls,
  roof: roofGroup,
  interior: interiorGroup,
  doorPos: new THREE.Vector3(0, 3.5, 1.1),
  isTransparent: false,
};

// ============ 树木 ============
function createTree(x, z, s) {
  const group = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.08 * s, 0.12 * s, 0.8 * s, 10);
  const trunk = new THREE.Mesh(trunkGeo, matTreeTrunk);
  trunk.position.y = 0.4 * s;
  trunk.castShadow = true;
  group.add(trunk);
  // 树冠（多层球）
  for (let c = 0; c < 3; c++) {
    const crownGeo = new THREE.SphereGeometry(0.28 * s * (1 - c * 0.15), 10, 8);
    const crown = new THREE.Mesh(crownGeo, c === 1 ? matTreeLeaves : new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.28, 0.6, 0.25 + c * 0.12),
      roughness: 0.6
    }));
    crown.position.y = 0.7 * s + c * 0.22 * s;
    crown.position.x = (Math.random() - 0.5) * 0.15 * s;
    crown.castShadow = true;
    group.add(crown);
  }
  const h = getTerrainHeight(x, z);
  group.position.set(x, h, z);
  scene.add(group);
}
// 山上的树
for (let i = 0; i < 10; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 2.7 + Math.random() * 3;
  createTree(Math.cos(angle) * dist, Math.sin(angle) * dist, 0.6 + Math.random() * 0.8);
}
// 山下的树
for (let i = 0; i < 8; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 6.5 + Math.random() * 4;
  createTree(Math.cos(angle) * dist, Math.sin(angle) * dist, 0.7 + Math.random() * 1.0);
}

// ============ 躲藏石头 ============
const hidingRocks = [];
for (let i = 0; i < 5; i++) {
  const angle = (i / 5) * Math.PI * 2 + Math.random() * 0.3;
  const dist = 2.8 + Math.random() * 2.7;
  const h = getTerrainHeight(Math.cos(angle) * dist, Math.sin(angle) * dist);
  const rockGeo = new THREE.SphereGeometry(0.4 + Math.random() * 0.6, 10, 8);
  const rock = new THREE.Mesh(rockGeo, matStone);
  const rx = Math.cos(angle) * dist;
  const rz = Math.sin(angle) * dist;
  rock.position.set(rx, h - 0.05, rz);
  rock.scale.y = 0.6;
  rock.castShadow = true;
  rock.receiveShadow = true;
  rock.name = 'hidingRock';
  scene.add(rock);
  hidingRocks.push({ mesh: rock, pos: new THREE.Vector3(rx, h, rz) });
}

// 灌木丛（也可躲藏）
const hidingBushes = [];
for (let i = 0; i < 6; i++) {
  const angle = (i / 6) * Math.PI * 2 + 0.5;
  const dist = 3.0 + Math.random() * 3.0;
  const h = getTerrainHeight(Math.cos(angle) * dist, Math.sin(angle) * dist);
  const bushGroup = new THREE.Group();
  for (let b = 0; b < 5; b++) {
    const bushGeo = new THREE.SphereGeometry(0.2 + Math.random() * 0.3, 8, 6);
    const bush = new THREE.Mesh(bushGeo, matBush);
    bush.position.set((Math.random() - 0.5) * 0.5, 0.1, (Math.random() - 0.5) * 0.5);
    bush.castShadow = true;
    bushGroup.add(bush);
  }
  const bx = Math.cos(angle) * dist;
  const bz = Math.sin(angle) * dist;
  bushGroup.position.set(bx, h, bz);
  bushGroup.name = 'hidingBush';
  scene.add(bushGroup);
  hidingBushes.push({ mesh: bushGroup, pos: new THREE.Vector3(bx, h, bz) });
}

// ============ 小老虎模型 ============
const tigerGroup = new THREE.Group();
tigerGroup.name = 'tiger';

// 身体
const bodyGeo = new THREE.CapsuleGeometry(0.2, 0.35, 8, 16);
const body = new THREE.Mesh(bodyGeo, matTigerOrange);
body.position.y = 0.32;
body.name = 'body';
tigerGroup.add(body);

// 白肚皮
const bellyGeo = new THREE.SphereGeometry(0.16, 12, 10);
const belly = new THREE.Mesh(bellyGeo, matTigerWhite);
belly.position.set(0, 0.28, -0.1);
belly.scale.set(0.9, 0.7, 0.4);
tigerGroup.add(belly);

// 身体条纹
for (let s = -2; s <= 2; s++) {
  const stripeGeo = new THREE.TorusGeometry(0.2, 0.018, 6, 20, Math.PI);
  const stripe = new THREE.Mesh(stripeGeo, matTigerStripe);
  stripe.position.set(0, 0.28 + s * 0.08, 0.12);
  stripe.rotation.x = Math.PI / 2;
  tigerGroup.add(stripe);
}

// 头部
const headGeo = new THREE.SphereGeometry(0.16, 20, 20);
const head = new THREE.Mesh(headGeo, matTigerOrange);
head.position.set(0, 0.58, 0.15);
head.scale.set(1, 0.9, 0.8);
head.name = 'head';
tigerGroup.add(head);

// 白口罩
const muzzleGeo = new THREE.SphereGeometry(0.1, 12, 10);
const muzzle = new THREE.Mesh(muzzleGeo, matTigerWhite);
muzzle.position.set(0, 0.53, 0.25);
muzzle.scale.set(0.8, 0.6, 0.5);
tigerGroup.add(muzzle);

// 鼻子
const noseGeo = new THREE.SphereGeometry(0.04, 8, 8);
const nose = new THREE.Mesh(noseGeo, matTigerNose);
nose.position.set(0, 0.54, 0.31);
tigerGroup.add(nose);

// 眼睛
for (let s = -1; s <= 1; s += 2) {
  const eyeGeo = new THREE.SphereGeometry(0.045, 12, 12);
  const eye = new THREE.Mesh(eyeGeo, matTigerEye);
  eye.position.set(s * 0.07, 0.6, 0.24);
  tigerGroup.add(eye);

  const pupilGeo = new THREE.SphereGeometry(0.028, 8, 8);
  const pupil = new THREE.Mesh(pupilGeo, matTigerPupil);
  pupil.position.set(s * 0.07, 0.6, 0.275);
  tigerGroup.add(pupil);

  const sparkleGeo = new THREE.SphereGeometry(0.012, 6, 6);
  const sparkle = new THREE.Mesh(sparkleGeo, matTigerEye);
  sparkle.position.set(s * 0.07 + 0.015, 0.615, 0.27);
  tigerGroup.add(sparkle);
}

// 耳朵
for (let s = -1; s <= 1; s += 2) {
  const earGeo = new THREE.ConeGeometry(0.06, 0.1, 8);
  const ear = new THREE.Mesh(earGeo, matTigerOrange);
  ear.position.set(s * 0.1, 0.68, 0.1);
  ear.rotation.z = s * 0.5;
  ear.rotation.x = 0.3;
  tigerGroup.add(ear);

  const earInnerGeo = new THREE.ConeGeometry(0.035, 0.06, 8);
  const earInner = new THREE.Mesh(earInnerGeo, matTigerEar);
  earInner.position.set(s * 0.1, 0.67, 0.11);
  earInner.rotation.z = s * 0.5;
  earInner.rotation.x = 0.3;
  tigerGroup.add(earInner);
}

// 头部条纹
for (let s = -1; s <= 1; s += 1) {
  const headStripeGeo = new THREE.BoxGeometry(0.04, 0.02, 0.08);
  const headStripe = new THREE.Mesh(headStripeGeo, matTigerStripe);
  headStripe.position.set(s * 0.04, 0.7, 0.18);
  tigerGroup.add(headStripe);
}

// 腿
const legs = [];
for (let fx = -1; fx <= 1; fx += 2) {
  for (let fz = -1; fz <= 1; fz += 2) {
    const legGeo = new THREE.CylinderGeometry(0.06, 0.07, 0.25, 10);
    const leg = new THREE.Mesh(legGeo, matTigerOrange);
    leg.position.set(fx * 0.13, 0.16, fz * 0.13);
    leg.name = 'leg';
    legs.push(leg);
    tigerGroup.add(leg);

    // 白爪子
    const pawGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.05, 10);
    const paw = new THREE.Mesh(pawGeo, matTigerWhite);
    paw.position.set(fx * 0.13, 0.03, fz * 0.13);
    paw.name = 'paw';
    tigerGroup.add(paw);
  }
}

// 尾巴
const tailGroup = new THREE.Group();
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0.3, -0.25),
  new THREE.Vector3(0, 0.4, -0.5),
  new THREE.Vector3(0.05, 0.55, -0.65),
  new THREE.Vector3(0.1, 0.6, -0.7),
  new THREE.Vector3(0.08, 0.5, -0.75),
]);
const tailGeo = new THREE.TubeGeometry(tailCurve, 20, 0.04, 10, false);
const tail = new THREE.Mesh(tailGeo, matTigerOrange);
tailGroup.add(tail);
// 尾巴条纹
for (let s = 0; s < 3; s++) {
  const tailStripeGeo = new THREE.TorusGeometry(0.05, 0.012, 6, 16);
  const tailStripe = new THREE.Mesh(tailStripeGeo, matTigerStripe);
  const pt = tailCurve.getPoint(0.3 + s * 0.25);
  tailStripe.position.copy(pt);
  tailGroup.add(tailStripe);
}
// 尾尖
const tailTipGeo = new THREE.SphereGeometry(0.045, 8, 8);
const tailTip = new THREE.Mesh(tailTipGeo, matTigerStripe);
tailTip.position.copy(tailCurve.getPoint(0.95));
tailGroup.add(tailTip);
tailGroup.name = 'tail';
tigerGroup.add(tailGroup);

// 老虎初始位置
tigerGroup.position.set(0, 3.55, 0.5);
tigerGroup.scale.set(0.85, 0.85, 0.85);
scene.add(tigerGroup);

// ============ 互动系统 ============
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let walkTarget = tigerGroup.position.clone();
let isWalking = false;
let tigerState = 'idle'; // idle | walking | inHouse | swimming | hiding
let hidingSpot = null;
let inHouse = false;
let swimSplashTimer = 0;

// 状态更新
function setTigerState(state) {
  tigerState = state;
  statusTag.className = '';
  switch (state) {
    case 'inHouse':
      statusTag.textContent = '🏠 在家里玩';
      statusTag.classList.add('in-house');
      hintBar.textContent = '🐯 点秋千、皮球或抓柱玩吧！点门外地面就出去～';
      break;
    case 'swimming':
      statusTag.textContent = '🌊 在池塘游泳';
      statusTag.classList.add('swimming');
      hintBar.textContent = '💦 小老虎在游泳！点岸边让它上岸吧～';
      break;
    case 'hiding':
      statusTag.textContent = '🙈 躲猫猫中';
      statusTag.classList.add('hiding');
      hintBar.textContent = '🤫 嘘～小老虎躲起来了！点别的地方叫它出来～';
      break;
    default:
      statusTag.textContent = '🐾 在山坡上散步';
      hintBar.textContent = '👆 点击地面让小老虎走过去吧！';
      break;
  }
}

// 地面交点
function getGroundPoint(clientX, clientY) {
  const x = (clientX / window.innerWidth) * 2 - 1;
  const y = -(clientY / window.innerHeight) * 2 + 1;
  mouse.set(x, y);
  raycaster.setFromCamera(mouse, camera);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, target);
  return target;
}

// 判断是否在池塘区域
function isInPond(pos) {
  const dx = pos.x - 3.8;
  const dz = pos.z - (-4.5);
  return Math.sqrt(dx * dx + dz * dz) < 1.4;
}

// 判断是否在房子门口
function isAtDoor(pos) {
  const dp = houseData.doorPos;
  const dx = pos.x - dp.x;
  const dz = pos.z - dp.z;
  return Math.abs(dx) < 0.6 && Math.abs(dz) < 0.5;
}

// 判断是否靠近躲藏点
function getNearHidingSpot(pos) {
  for (const rock of hidingRocks) {
    const dx = pos.x - rock.pos.x;
    const dz = pos.z - rock.pos.z;
    if (Math.sqrt(dx * dx + dz * dz) < 0.6) return rock;
  }
  for (const bush of hidingBushes) {
    const dx = pos.x - bush.pos.x;
    const dz = pos.z - bush.pos.z;
    if (Math.sqrt(dx * dx + dz * dz) < 0.5) return bush;
  }
  return null;
}

// 点击处理
function handleClick(clientX, clientY) {
  const target = getGroundPoint(clientX, clientY);
  if (!target) return;

  // 限制范围
  target.x = THREE.MathUtils.clamp(target.x, -8, 8);
  target.z = THREE.MathUtils.clamp(target.z, -8, 8);

  // 如果在屋里，点击门外 → 出门
  if (inHouse && !isAtDoor(new THREE.Vector3(target.x, 0, target.z))) {
    exitHouse();
    return;
  }

  // 如果在躲藏，点击任何地方 → 出来
  if (tigerState === 'hiding') {
    tigerGroup.scale.set(0.85, 0.85, 0.85);
    setTigerState('idle');
    hidingSpot = null;
    if (inHouse) exitHouse();
  }

  // 点击是否在躲藏点上
  const spot = getNearHidingSpot(new THREE.Vector3(target.x, 0, target.z));
  if (spot && tigerState !== 'hiding' && !inHouse) {
    hidingSpot = spot;
    walkTarget.set(spot.pos.x, spot.pos.y + 0.1, spot.pos.z);
    isWalking = true;
    return;
  }

  // 计算目标高度
  const h = getTerrainHeight(target.x, target.z);
  walkTarget.set(target.x, h + 0.05, target.z);
  isWalking = true;

  // 如果在池塘里
  if (isInPond(walkTarget) && tigerState !== 'swimming') {
    setTigerState('swimming');
  } else if (!isInPond(walkTarget) && tigerState === 'swimming') {
    setTigerState('idle');
  }
}

// 进出房子
function enterHouse() {
  inHouse = true;
  setTigerState('inHouse');
  // 屋顶半透明
  houseData.roof.traverse(child => {
    if (child.material && child.material.opacity !== undefined) {
      child.material.transparent = true;
      child.material.opacity = 0.22;
      child.material.depthWrite = true;
    }
  });
  // 墙壁半透明
  houseData.walls.forEach(w => {
    if (w.material) {
      w.material.transparent = true;
      w.material.opacity = 0.2;
      w.material.depthWrite = true;
    }
  });
  houseData.isTransparent = true;
  enterBtn.style.display = 'none';
}

function exitHouse() {
  inHouse = false;
  tigerState = 'idle';
  setTigerState('idle');
  // 恢复材质
  houseData.roof.traverse(child => {
    if (child.material && child.material.opacity !== undefined) {
      child.material.transparent = false;
      child.material.opacity = 1;
    }
  });
  houseData.walls.forEach(w => {
    if (w.material) {
      w.material.transparent = false;
      w.material.opacity = 1;
    }
  });
  houseData.isTransparent = false;
  // 走到门外
  walkTarget.set(houseData.doorPos.x, houseData.doorPos.y, houseData.doorPos.z + 0.6);
  isWalking = true;
}

enterBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  enterHouse();
});

// 室内物品互动
function checkInteriorInteraction() {
  if (!inHouse) return;
  const tp = tigerGroup.position.clone();
  // 皮球
  const ballWorld = new THREE.Vector3();
  ball.getWorldPosition(ballWorld);
  if (tp.distanceTo(ballWorld) < 0.35) {
    hintBar.textContent = '⚽ 小老虎在拍皮球！皮球滚来滚去～';
    // 皮球弹跳
    ball.position.x += (Math.random() - 0.5) * 0.3;
    ball.position.z += (Math.random() - 0.5) * 0.3;
    ball.position.x = THREE.MathUtils.clamp(ball.position.x, -0.2, 0.8);
    ball.position.z = THREE.MathUtils.clamp(ball.position.z, -0.3, 0.7);
  }
  // 秋千
  const swingWorld = new THREE.Vector3();
  swingGroup.getWorldPosition(swingWorld);
  if (tp.distanceTo(swingWorld) < 0.5) {
    hintBar.textContent = '🎠 小老虎在荡秋千！好开心～';
    swingGroup.rotation.z = Math.sin(Date.now() * 0.003) * 0.3;
  }
  // 抓柱
  const scratchWorld = new THREE.Vector3();
  scratchPost.getWorldPosition(scratchWorld);
  if (tp.distanceTo(scratchWorld) < 0.4) {
    hintBar.textContent = '💅 小老虎在磨爪子！咔嚓咔嚓～';
  }
}

// ============ 事件监听 ============
window.addEventListener('click', (e) => {
  if (e.target === enterBtn) return;
  handleClick(e.clientX, e.clientY);
});

// 触控
window.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    handleClick(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: true });

// 摄像机轨道
let isDragging = false, prevMX = 0, prevMY = 0;
let orbitTheta = Math.PI / 3, orbitPhi = Math.PI / 5.5, orbitRadius = 9;
const orbitCenter = new THREE.Vector3(0, 3, 0);
let autoRotate = true, autoRotateTimer = null;

function updateCam() {
  const sp = Math.sin(orbitPhi), cp = Math.cos(orbitPhi);
  const st = Math.sin(orbitTheta), ct = Math.cos(orbitTheta);
  camera.position.set(
    orbitCenter.x + orbitRadius * cp * st,
    orbitCenter.y + orbitRadius * sp,
    orbitCenter.z + orbitRadius * cp * ct
  );
  camera.lookAt(orbitCenter);
}

window.addEventListener('mousedown', (e) => {
  isDragging = true; autoRotate = false;
  prevMX = e.clientX; prevMY = e.clientY;
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevMX) * 0.004;
  orbitPhi -= (e.clientY - prevMY) * 0.004;
  orbitPhi = THREE.MathUtils.clamp(orbitPhi, -0.4, 1.1);
  prevMX = e.clientX; prevMY = e.clientY;
  updateCam();
  if (autoRotateTimer) clearTimeout(autoRotateTimer);
  autoRotateTimer = setTimeout(() => { autoRotate = true; }, 2500);
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('wheel', (e) => {
  orbitRadius += e.deltaY * 0.01;
  orbitRadius = THREE.MathUtils.clamp(orbitRadius, 5, 16);
  updateCam();
  autoRotate = false;
  if (autoRotateTimer) clearTimeout(autoRotateTimer);
  autoRotateTimer = setTimeout(() => { autoRotate = true; }, 2500);
});

// 触控轨道
let pinchDist0 = 0, pinchRad0 = 0;
window.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true; autoRotate = false;
    prevMX = e.touches[0].clientX; prevMY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist0 = Math.sqrt(dx * dx + dy * dy);
    pinchRad0 = orbitRadius;
  }
});
window.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && isDragging) {
    orbitTheta -= (e.touches[0].clientX - prevMX) * 0.004;
    orbitPhi -= (e.touches[0].clientY - prevMY) * 0.004;
    orbitPhi = THREE.MathUtils.clamp(orbitPhi, -0.4, 1.1);
    prevMX = e.touches[0].clientX; prevMY = e.touches[0].clientY;
    updateCam();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    orbitRadius = THREE.MathUtils.clamp(pinchRad0 * (pinchDist0 / Math.max(dist, 1)), 5, 16);
    updateCam();
  }
});
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ 动画循环 ============
const clock = new THREE.Clock();
updateCam();

function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.12);
  const t = time * 0.001;

  // 自动旋转
  if (autoRotate && !isDragging) {
    orbitTheta += dt * 0.12;
    updateCam();
  }

  // --- 老虎移动 ---
  const tp = tigerGroup.position.clone();
  const toTarget = walkTarget.clone().sub(tp);
  const dist = toTarget.length();

  if (dist > 0.08 && (isWalking || tigerState === 'swimming')) {
    const speed = tigerState === 'swimming' ? 1.2 : 2.0;
    const step = Math.min(speed * dt, dist);
    const dir = toTarget.normalize();
    tigerGroup.position.add(dir.clone().multiplyScalar(step));

    // 地面高度跟随
    if (tigerState !== 'swimming') {
      const h = getTerrainHeight(tigerGroup.position.x, tigerGroup.position.z);
      tigerGroup.position.y = h + 0.05;
    }

    // 朝向
    const targetRot = Math.atan2(dir.x, dir.z);
    const diff = targetRot - tigerGroup.rotation.y;
    tigerGroup.rotation.y += Math.atan2(Math.sin(diff), Math.cos(diff)) * 6 * dt;

    // 走路动画 - 腿交替
    const walkCycle = t * 10;
    legs.forEach((leg, idx) => {
      const isFront = idx < 2;
      const phase = isFront ? (idx % 2 === 0 ? 0 : Math.PI) : (idx % 2 === 0 ? Math.PI : 0);
      if (tigerState !== 'swimming') {
        leg.rotation.x = Math.sin(walkCycle + phase) * 0.5;
      } else {
        // 游泳时的划水动作
        leg.rotation.x = Math.sin(t * 6 + phase) * 0.7;
      }
    });

    // 身体起伏
    if (tigerState !== 'swimming') {
      body.position.y = 0.32 + Math.abs(Math.sin(walkCycle)) * 0.04;
    }

    // 尾巴摇摆
    tailGroup.rotation.z = Math.sin(t * 8) * 0.25;
    tailGroup.rotation.x = Math.sin(t * 5) * 0.15;

    // 游泳特效
    if (isInPond(tigerGroup.position)) {
      if (tigerState !== 'swimming') setTigerState('swimming');
      tigerGroup.position.y = 0.1; // 半浸入水中
      swimSplashTimer += dt;
      if (swimSplashTimer > 0.2) {
        swimSplashTimer = 0;
        // CSS 水花
        for (let s = 0; s < 3; s++) {
          const splash = document.createElement('div');
          splash.className = 'splash-particle';
          splash.style.setProperty('--dx', (Math.random() - 0.5) * 80 + 'px');
          splash.style.setProperty('--dy', -(20 + Math.random() * 40) + 'px');
          splash.style.left = '50%'; splash.style.top = '60%';
          document.body.appendChild(splash);
          setTimeout(() => splash.remove(), 700);
        }
      }
    }

    // 到达池塘区
    if (isInPond(tigerGroup.position) && tigerState !== 'swimming') {
      setTigerState('swimming');
    }

    // 靠近房子门
    if (isAtDoor(tigerGroup.position) && !inHouse && tigerState !== 'swimming') {
      enterBtn.classList.add('show');
    } else {
      enterBtn.classList.remove('show');
      // 已在门口 → 自动进屋
      if (isAtDoor(tigerGroup.position) && !inHouse && dist < 0.2) {
        // do nothing, wait for button click or auto-enter
      }
    }

    // 到达躲藏点
    if (hidingSpot && dist < 0.15) {
      setTigerState('hiding');
      tigerGroup.scale.set(0.85, 0.4, 0.85); // 蹲下
      isWalking = false;
      hidingSpot = null;
      // 几秒后自动出来
      setTimeout(() => {
        if (tigerState === 'hiding') {
          tigerGroup.scale.set(0.85, 0.85, 0.85);
          setTigerState('idle');
        }
      }, 4000);
    }

    if (dist < 0.08) {
      isWalking = false;
      if (tigerState !== 'hiding') setTigerState(inHouse ? 'inHouse' : 'idle');
    }
  } else {
    // 静止时的微动
    if (!isWalking) {
      body.position.y += (0.32 - body.position.y) * 6 * dt;
      legs.forEach(leg => { leg.rotation.x *= 0.9; });
    }
    tailGroup.rotation.z = Math.sin(t * 3) * 0.15;
  }

  // 进屋后室内互动检测
  if (inHouse) {
    checkInteriorInteraction();
    // 老虎在屋内地板上
    tigerGroup.position.y = houseGroup.position.y + 0.1;
    const tp2 = tigerGroup.position;
    if (Math.abs(tp2.x) > 1.1 || Math.abs(tp2.z - 0.5) > 1.1) {
      // 老虎走到屋外 → 自动出门
    }
  }

  // 秋千微小摆动
  if (!inHouse) {
    swingGroup.rotation.z = Math.sin(t * 1.5) * 0.08;
  }

  // 烟囱冒烟
  if (Math.random() < 0.08) {
    // 简单烟效果 - 跳过以保持性能
  }

  renderer.render(scene, camera);
}

// ============ 启动 ============
setTimeout(() => {
  loading.classList.add('hidden');
}, 900);

requestAnimationFrame(animate);

console.log('🐯 小老虎的山间小屋已就绪！');
console.log('  👆 点击地面 → 小老虎走过去');
console.log('  🏠 靠近房子 → 点按钮进屋');
console.log('  🎠 屋里秋千 | ⚽ 皮球 | 💅 磨爪柱');
console.log('  🌊 点池塘 → 老虎下水游泳');
console.log('  🙈 点大石头 → 老虎躲猫猫');
</script>
